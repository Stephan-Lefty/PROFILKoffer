[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profilkoffer"
# Die Fassung steht ausschließlich in profilkoffer/__init__.py. Sie hier zu
# wiederholen ging bei MailBurg schief: pyproject.toml blieb bei 0.1.0
# stehen, während das Programm längst etwas anderes meldete.
dynamic = ["version"]
description = "Thunderbird und Vivaldi von einem Rechner auf den anderen"
readme = "README.md"
# 3.11 als Untergrenze. Debian 13 bringt 3.13 mit, Manjaro 3.14 - beide
# liegen darüber, und darunter wurde nichts erprobt.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephan Rösner" }]
keywords = ["thunderbird", "vivaldi", "backup", "migration", "linux", "debian", "manjaro"]

classifiers = [
    # Nur, was tatsächlich im Betrieb erprobt ist.
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Backup",
]

# Keine Laufzeitabhängigkeiten aus PyPI. Was PROFILKoffer braucht, bringt
# Python selbst mit (tarfile, shutil, tkinter) oder das System (lsblk,
# pgrep aus util-linux bzw. procps). Tkinter gehört ausdrücklich NICHT
# hierher: Es kommt aus der Distribution (python3-tk bzw. tk), nicht aus
# PyPI - dort gibt es es gar nicht.
dependencies = []

[project.optional-dependencies]
entwicklung = ["pytest>=8"]

[project.scripts]
profilkoffer = "profilkoffer.__main__:main"

[project.gui-scripts]
# Eigener Einstieg, damit ein Fehlstart der Oberfläche nicht die
# Kommandozeile mitreißt - und damit der Desktop-Eintrag etwas hat,
# worauf er zeigen kann.
profilkoffer-ui = "profilkoffer.ui.fenster:main"

[tool.setuptools.dynamic]
version = { attr = "profilkoffer.__version__" }

[tool.setuptools.packages.find]
include = ["profilkoffer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
